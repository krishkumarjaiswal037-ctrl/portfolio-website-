<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Weather App</title>




  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#ffb86b;
      --muted:#9aa4b2;
      --glass: rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background: linear-gradient(180deg,#071029 0%, #0f1724 100%);
      color:#e6eef6;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .app {
      width:100%;
      max-width:760px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;
      padding:22px;
      box-shadow: 0 10px 30px rgba(2,6,23,0.6);
      border: 1px solid rgba(255,255,255,0.03);
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }
    header h1{
      font-size:20px;
      margin:0;
      letter-spacing:0.2px;
    }
    header p{
      margin:0;
      color:var(--muted);
      font-size:13px;
    }

    .controls{
      display:flex;
      gap:10px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    input[type="text"]{
      flex:1 1 260px;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.04);
      background:var(--glass);
      color:inherit;
      outline:none;
      font-size:15px;
    }

    button{
      padding:12px 16px;
      border-radius:10px;
      border:none;
      background:linear-gradient(180deg,var(--accent),#ff9f3a);
      color:#071029;
      font-weight:700;
      cursor:pointer;
      box-shadow: 0 6px 18px rgba(255,160,90,0.12);
    }
    button:disabled{opacity:0.6; cursor:default}

    .card{
      display:grid;
      grid-template-columns: 1fr 220px;
      gap:18px;
      align-items:center;
      padding:18px;
      border-radius:12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.03);
    }

    .main-info{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .location{
      font-size:18px;
      font-weight:700;
    }
    .time{
      color:var(--muted);
      font-size:13px;
    }
    .temp{
      font-size:48px;
      font-weight:800;
      margin-top:6px;
    }
    .condition{
      color:var(--muted);
      font-size:15px;
      margin-top:6px;
    }

    .side{
      text-align:center;
      padding:8px;
      border-radius:10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
    }
    .icon{
      width:96px;
      height:96px;
      margin:auto;
      display:block;
    }
    .details{
      display:flex;
      gap:12px;
      margin-top:12px;
      justify-content:space-between;
      color:var(--muted);
      font-size:14px;
    }

    .message{
      margin-top:12px;
      color:var(--muted);
      font-size:14px;
    }

    .footer{
      margin-top:14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      color:var(--muted);
      font-size:13px;
    }

    @media (max-width:720px){
      .card{grid-template-columns:1fr; text-align:center}
      .side{order:-1}
      .details{flex-direction:column; gap:8px; align-items:center}
      header{flex-direction:column; align-items:flex-start; gap:6px}
    }
  </style>
</head>





<body>
  <div class="app" role="application" aria-label="Weather app">
    <header>
      <div>
        <h1>Weather By Krish</h1>
        <p>Enter a location to get the current temperature and conditions</p>
      </div>
      <div>
        <p style="margin:0; font-size:13px; color:var(--muted)">Powered by krish</p>
      </div>
    </header>

    <div class="controls">
      <input id="locationInput" type="text" placeholder="City name, postal code, or lat,long (e.g., Kathmandu or 27.7172,85.3240)" aria-label="Location input" />
      <button id="getWeatherBtn">Get Weather</button>
      <button id="useMyKeyBtn" title="Use the API key embedded in the script">Use default key</button>
    </div>

    <div id="resultArea" class="card" aria-live="polite" hidden>
      <div class="main-info">
        <div class="location" id="locName">—</div>
        <div class="time" id="localTime">Local time —</div>
        <div class="temp" id="temperature">--°C</div>
        <div class="condition" id="conditionText">—</div>
        <div class="message" id="messageText"></div>
      </div>

      <div class="side">
        <img id="conditionIcon" class="icon" src="" alt="weather icon" />
        <div class="details">
          <div><strong>Humidity</strong><div id="humidity">--%</div></div>
          <div><strong>Wind</strong><div id="wind">-- kph</div></div>
          <div><strong>Feels like</strong><div id="feelslike">--°C</div></div>
        </div>
      </div>
    </div>

    <div id="status" class="message" style="display:none"></div>

    <div class="footer">
      <div>Tip: Try "London", "Kathmandu", or "27.7172,85.3240"</div>
      <div id="credit" style="color:var(--muted)">Your API key will be used client-side</div>
    </div>
  </div>







  <script>
    // ====== CONFIGURE YOUR API KEY ======
    // Default key (from your message). Replace with your own key or let users provide it.
    let apiKey = "6603acfe66054712a29142210261407";

    // Elements
    const input = document.getElementById("locationInput");
    const btn = document.getElementById("getWeatherBtn");
    const useKeyBtn = document.getElementById("useMyKeyBtn");
    const resultArea = document.getElementById("resultArea");
    const status = document.getElementById("status");

    const locName = document.getElementById("locName");
    const localTime = document.getElementById("localTime");
    const temperature = document.getElementById("temperature");
    const conditionText = document.getElementById("conditionText");
    const conditionIcon = document.getElementById("conditionIcon");
    const humidity = document.getElementById("humidity");
    const wind = document.getElementById("wind");
    const feelslike = document.getElementById("feelslike");
    const messageText = document.getElementById("messageText");

    // Helper: show status
    function showStatus(msg, isError = false) {
      status.style.display = "block";
      status.textContent = msg;
      status.style.color = isError ? "#ffb3a7" : "var(--muted)";
    }

    // Build API URL
    function buildUrl(query) {
      // Use the provided WeatherAPI endpoint format
      // Example: http://api.weatherapi.com/v1/current.json?key=YOUR_KEY&q=London&aqi=yes
      const base = "http://api.weatherapi.com/v1/current.json";
      const encoded = encodeURIComponent(query);
      return `${base}?key=${encodeURIComponent(apiKey)}&q=${encoded}&aqi=yes`;
    }

    // Render data
    function render(data) {
      if (!data || !data.location || !data.current) return;
      resultArea.hidden = false;
      locName.textContent = `${data.location.name}, ${data.location.region || data.location.country}`;
      localTime.textContent = `Local time: ${data.location.localtime}`;
      temperature.textContent = `${data.current.temp_c}°C`;
      conditionText.textContent = `${data.current.condition.text}`;
      conditionIcon.src = data.current.condition.icon.startsWith("//") ? "https:" + data.current.condition.icon : data.current.condition.icon;
      conditionIcon.alt = data.current.condition.text;
      humidity.textContent = `${data.current.humidity}%`;
      wind.textContent = `${data.current.wind_kph} kph`;
      feelslike.textContent = `${data.current.feelslike_c}°C`;

      // Friendly message
      const temp = data.current.temp_c;
      if (temp <= 5) {
        messageText.textContent = "Brrr — bundle up!";
      } else if (temp <= 20) {
        messageText.textContent = "Nice and cool — a light jacket will do.";
      } else {
        messageText.textContent = "Warm and pleasant — enjoy the day!";
      }
    }

    // Fetch weather
    async function fetchWeather(query) {
      if (!query) {
        showStatus("Please enter a location.", true);
        return;
      }
      if (!apiKey) {
        showStatus("No API key set. Click 'Use default key' or set your key in the script.", true);
        return;
      }

      showStatus("Loading weather…");
      btn.disabled = true;

      try {
        const url = buildUrl(query);
        const resp = await fetch(url);
        if (!resp.ok) {
          // Try to parse error message
          const errText = await resp.text();
          throw new Error(`API error: ${resp.status} ${resp.statusText} — ${errText}`);
        }
        const data = await resp.json();
        render(data);
        showStatus("Weather updated.");
      } catch (err) {
        console.error(err);
        showStatus("Could not fetch weather. Check location or API key.", true);
        resultArea.hidden = true;
      } finally {
        btn.disabled = false;
      }
    }

    // Event listeners
    btn.addEventListener("click", () => {
      const q = input.value.trim();
      fetchWeather(q);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        btn.click();
      }
    });

    // Use default key button: prompts user to confirm using the embedded key
    useKeyBtn.addEventListener("click", () => {
      const use = confirm("This will use the default API key embedded in the page. Continue?");
      if (use) {
        apiKey = "6603acfe66054712a29142210261407";
        showStatus("Default API key enabled.");
      }
    });

    // Optional: try a sample location on first load (comment out if undesired)
    // fetchWeather("London");
  </script>
</body>
</html>
