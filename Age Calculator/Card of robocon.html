<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Robocon Team Member Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #9797b0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .profile-card {
      background: #e3494924;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 320px;
      text-align: center;
      padding: 20px;
    }

    .photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #ccc;
      margin: 0 auto 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      color: #555;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .role {
      font-size: 16px;
      color: #0077b6;
      margin-bottom: 10px;
    }

    .reg-number {
      font-size: 14px;
      color: #444;
      margin-bottom: 15px;
    }

    .tagline {
      font-style: italic;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="photo">Photo</div>
    <div class="name">KRISH KUMAR JASIWAL</div>
    <div class="role">WEB DEV</div>
    <div class="reg-number">Reg. No:RA2611003011736</div>
    <div class="tagline">"Innovating robots, inspiring minds"</div>
  </div>
</body>
</html>
