<html>
   <head>
   <title>Job Application Form</title>
   <link rel="stylesheet" href="form1.css" />
   </head>
<style>
   body{
   background-color:grey;
}

.container {
   max-width:900px;
   margin: 0 auto;
   text-align:center;
   }

.apply_box{
   max-width:600px;
   padding:10px;
   background-color:#2bffc0;
   margin: 0 auto;
   margin-top:50px;
   box-shadow: 4px 3px 5px rgba(1, 1, 1, 0.1);
   border-radius:15px;
}

p{
  margin-top:12px;
  font-size:27px;
  color:blue;
  border-style:double;
  border-color:yellow;
  border-width:10px;
  background-color:green;
  padding:2px;
  diplay:flex;
  display:grid;
}


.last{
  margin-top:12px;
  font-size:23.9px;
  color:blue;
  border-style:inset;
  border-color:yellow;
  border-width:10px;
  background-color:green;
  padding:2px;
  diplay:flex;
  display:grid;
}


.title_small{
   font-size:16px;
}

.form_container{
  margin-top:20px;
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap:20px;
}

.form_control{
  display:flex;
  flex-direction:column;
  color:purple;
}

label{ 
  font-size:25px;
  margin-bottom:5px;
  
}

input,select,textarea {
  padding:6px 10px;
  border:1px solid;
  border-color:black;
  border-radius:5px;
  font-size:20px;
 
}

input:focus{
  outline-color:red;
}

.button-container{
  display:flex;
  justify-content:flex-end;
  margin-top:20px;
}

button{
  background-color:green;
  border: transparent dotted 2px;
  padding:5px 6px;
  border-radius:8px;
  transition:0.1s ease-in; 
}

button:hover{
  background-color:yellow;
  border:2px solid grey;
  color:black;
  transition:0.1s ease-in; 
  cursor:pointer;
}

.textarea_control{
grid-column:1;
}

.textarea_control textarea{
  width:100%;
}

@media(max- width: 460px){
  .textarea_control{
grid-column: 1 / span 1; }
}



</style>








   <body>
     
    <p>! HELLO, MYSELF KRISH JAISWAL !</p> 
     
     
   <hr color="yellow" height="90px" width="100%" size="10">
   <hr color="blue" height="90px" width="100%" size="10">
     
     
      <div class="container">
         <div class="apply_box">
            <h1> JOB APPLICATION 
               <span class="title_small"> (Web)</span>
            </h1>
            
            <form action="">
              <div class="form_container">
                 
                <div class="form_control">
                <label for="first_name">First Name</label>
                    <input
                    id="first_name"         
                    name="first_name"
                    placeholder="Enter First Name.......">
                 </div>
              
              
              <div class="form_control">
                <label for="last_name">Last Name</label>
                    <input
                    id="last_name"         
                    name="last_name"
                    placeholder="Enter Last Name.......">
                 </div>
              
              
              <div class="form_control">
                <label for="email">Email</label>
                   <input
                    type="email"
                    id="email"         
                    name="email"
                    placeholder="Enter Email.......">
                 </div>
              
                
               <div class="form_control">
                <label for="job_role">Job Role</label>
                <select id="job_role" name="job_role">
                <option value="">Select Job Role</option>
               <option value="frontend">Frontend Developer</
               option>
               <option value="backend">Backend Developer</option>
               <option value="full_stack">Full_Stack Developer</.   
               option>
               </option value="">Select Job Role</option> 
               <option value="ul_ux">ul_ux Disigner</option>
                </select>
                 </div>
              
              
              <div class="textarea_control">
                <label for="address">Address</label>
                  <textarea 
                  id="address"
                   name="address"
                   row="3" 
                   cols="30"
                   placeholder="Enter Address...."
                  ></textarea>
                 </div>
              
              
              <div class="form_control">
                <label for="city">City</label>
                    <input
                    id="city"         
                    name="city"
                    placeholder="Enter City Name.......">
                 </div>
                 
               <div class="form_control">
                    <label for="pincode">Pincode</label>
                    <input
                    type="number"
                    id="pincode"         
                    name="pincode"
                    placeholder="Enter pincode Name.......">
                 </div>
                 
               <div class="form_control">
                <label for="date">Date Of Birth</label>
                    <input
                    value="2081-12-26"
                    type="date"
                    id="date"         
                    name="date">
                 </div>  
                 
                  <div class="form_control">
                <label for="upload">Upload Your CV</label>
                    <input
                    type="file"
                    id="upload"         
                    name="upload">
                 </div>
                 
              </div>
              <div class="button-container">
                <button type="submit">Apply Now</button>
              </div>
            </form>
         </div>
      </div>
      
     <div class="last">* THANKS FOR YOUR PRECIOUS TIME *</div>
      
    <br><br>  
    
   <hr color="yellow" height="90px" width="100%" size="10">
   <hr color="blue" height="90px" width="100%" size="10">


   </body>
</html>
